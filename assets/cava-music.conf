# Quickshell music visualizer CAVA profile.
#
# These values are written explicitly so the future Music settings page can
# edit this file without first generating missing keys. CAVA can reload the
# profile after changes with SIGUSR1; Quickshell may also restart the process.
# Current values preserve the approved terminal-like visual behavior.
# GPT — 2026-07-25

[general]
# Spectrum density. AudioSpectrum.qml currently expects the same band count.
bars = 32

# Frame delivery rate. Higher values are smoother but use more CPU.
framerate = 60

# Starting/manual amplitude. With autosens enabled this is the initial value.
sensitivity = 100

# 0 = manual sensitivity; 1 = normal automatic sensitivity; 2+ = aggressive.
autosens = 1

# Frequency range represented from the first to last bar.
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

# Seconds of silence before CAVA sleeps. 0 disables sleep mode.
sleep_timer = 0

[input]
# Follow the monitor source of the currently selected PipeWire output.
method = pipewire
source = auto

# PipeWire's normal default. Exposed here for future advanced settings.
sample_rate = 48000
sample_bits = 16

# PipeWire-specific behavior. These are CAVA defaults and preserve current use.
active = 1
remix = 1
virtual = 1

[output]
# Quickshell consumes a newline-delimited ASCII stream from stdout.
method = raw
channels = mono
mono_option = average
reverse = 0

data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
# Optional spectrum-shape effects. Zero keeps the normal CAVA spectrum.
monstercat = 0
waves = 0

# 0 = fastest/noisiest, 100 = slowest/smoothest. CAVA default is 77.
noise_reduction = 77

[eq]
# Equalizer weights, low to high frequency. All 1.0 is neutral.
# A future advanced settings page can expose these or rewrite more points.
1 = 1
2 = 1
3 = 1
4 = 1
5 = 1
